<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니 - 라온 (RAON)</title>

  <!-- Favicon -->
  <link rel="icon" href="/logo_square.png" type="image/png">

  <!-- OG -->
  <meta property="og:title" content="장바구니 - 라온 (RAON)">
  <meta property="og:image" content="https://raon-product.vercel.app/logo_square.png">
  <meta property="og:url" content="https://raon-product.vercel.app/cart.html">
  <meta property="og:type" content="website">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#004ED4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="라온">
  <link rel="apple-touch-icon" href="/logo_square.png">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css" rel="stylesheet" />
  <link rel="stylesheet" href="cart.css?v=3">
</head>
<body>
  <div class="page">

    <!-- ── Header (Fixed) ── -->
    <header class="header">
      <div class="header-left">
        <button class="header-icon-btn" onclick="history.back()" aria-label="뒤로가기">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 13L5 8L10 3" stroke="#1A1B22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="header-title">장바구니</span>
      </div>
      <button class="header-icon-btn" onclick="clearCart()" aria-label="전체삭제">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 4h12M5 4V2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5V4M6 7v5M10 7v5M3 4l.75 9a.75.75 0 0 0 .75.75h7a.75.75 0 0 0 .75-.75L13 4" stroke="#1A1B22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <!-- ── Main (Scrollable) ── -->
    <main class="main">

      <!-- 전체선택 바 -->
      <div class="selection-bar">
        <div class="selection-label" onclick="toggleSelectAll()">
          <div class="checkbox" id="selectAllBox"></div>
          <span>전체선택</span>
        </div>
        <button class="selection-delete" onclick="deleteSelected()">선택삭제</button>
      </div>

      <!-- 장바구니 목록 -->
      <div class="cart-list" id="cartList"></div>

    </main>

    <!-- ── Total Bar (Fixed Bottom) ── -->
    <div class="total-bar">
      <span class="total-label">총 상품금액</span>
      <span class="total-price" id="totalPrice">0원</span>
    </div>

  </div>

  <script>
    const IMG = 'https://contents.sixshop.com/thumbnails/uploadedFiles/33333/product/';

    // 장바구니 데이터 (localStorage)
    function getCart() {
      try { return JSON.parse(localStorage.getItem('raon_cart') || '[]'); }
      catch { return []; }
    }

    function saveCart(cart) {
      localStorage.setItem('raon_cart', JSON.stringify(cart));
    }

    // 선택 상태 (cartItemId → boolean)
    let selected = {};

    function render() {
      const cart = getCart();
      const list = document.getElementById('cartList');

      if (!cart.length) {
        list.innerHTML = `
          <div class="cart-empty">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <path d="M7 10h4l5 22h18l4-16H15" stroke="#C7C4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="20" cy="38" r="2.5" fill="#C7C4D8"/>
              <circle cx="33" cy="38" r="2.5" fill="#C7C4D8"/>
            </svg>
            <p>장바구니가 비어있어요</p>
          </div>`;
        updateTotal(cart);
        updateSelectAll(cart);
        return;
      }

      list.innerHTML = cart.map((item, i) => {
        const isChecked = selected[item.cartId] !== false;
        const imgSrc = IMG + item.img;
        const itemTotal = parsePrice(item.price) * item.qty;

        return `
          <div class="cart-item" id="item-${item.cartId}">
            <div class="item-checkbox-wrap">
              <div class="checkbox ${isChecked ? 'checked' : ''}"
                   onclick="toggleItem('${item.cartId}')"></div>
            </div>
            <div class="item-img">
              <img src="${imgSrc}" alt="${item.title}" loading="lazy">
            </div>
            <div class="item-info">
              <div class="item-name">${item.title}</div>
              <div class="item-price">${formatPrice(itemTotal)}</div>
              <div class="item-qty-wrap">
                <div class="qty-control">
                  <button class="qty-btn" onclick="changeQty('${item.cartId}', -1)">−</button>
                  <div class="qty-display">${item.qty}</div>
                  <button class="qty-btn" onclick="changeQty('${item.cartId}', 1)">+</button>
                </div>
              </div>
            </div>
            <button class="item-delete" onclick="removeItem('${item.cartId}')" aria-label="삭제">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M1 1l10 10M11 1L1 11" stroke="#777587" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>`;
      }).join('');

      updateTotal(cart);
      updateSelectAll(cart);
    }

    function parsePrice(priceStr) {
      return parseInt(priceStr.replace(/[^0-9]/g, '')) || 0;
    }

    function formatPrice(num) {
      return num.toLocaleString('ko-KR') + '원';
    }

    function updateTotal(cart) {
      const total = cart.reduce((sum, item) => {
        if (selected[item.cartId] === false) return sum;
        return sum + parsePrice(item.price) * item.qty;
      }, 0);
      document.getElementById('totalPrice').textContent = formatPrice(total);
    }

    function updateSelectAll(cart) {
      const box = document.getElementById('selectAllBox');
      const allChecked = cart.length > 0 && cart.every(item => selected[item.cartId] !== false);
      box.className = 'checkbox' + (allChecked ? ' checked' : '');
    }

    function toggleItem(cartId) {
      selected[cartId] = selected[cartId] === false ? true : false;
      render();
    }

    function toggleSelectAll() {
      const cart = getCart();
      const allChecked = cart.every(item => selected[item.cartId] !== false);
      cart.forEach(item => { selected[item.cartId] = allChecked ? false : true; });
      render();
    }

    function changeQty(cartId, delta) {
      const cart = getCart();
      const item = cart.find(i => i.cartId === cartId);
      if (!item) return;
      item.qty = Math.max(1, (item.qty || 1) + delta);
      saveCart(cart);
      render();
    }

    function removeItem(cartId) {
      let cart = getCart().filter(i => i.cartId !== cartId);
      delete selected[cartId];
      saveCart(cart);
      render();
    }

    function deleteSelected() {
      let cart = getCart().filter(item => selected[item.cartId] === false);
      saveCart(cart);
      render();
    }

    function clearCart() {
      if (!confirm('장바구니를 모두 비울까요?')) return;
      saveCart([]);
      selected = {};
      render();
    }

    // 초기 렌더
    render();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
