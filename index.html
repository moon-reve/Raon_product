</head>
<body>
  <div class="page">
    <div class="main">

      <!-- ── Header ── -->
      <header class="header">
        <div class="logo">RAON</div>
        <div class="header-icons">
          <!-- Search -->
          <button class="icon-btn" aria-label="검색">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="9" cy="9" r="6.5" stroke="#1A1B22" stroke-width="1.8"/>
              <path d="M14 14L18 18" stroke="#1A1B22" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <!-- Cart -->
          <button class="cart-btn" aria-label="장바구니" onclick="location.href='cart.html'">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.5 3.5H4.5L6.2 12.5H15.8L17.5 6.5H5.5" stroke="#1A1B22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="8" cy="16" r="1.2" fill="#1A1B22"/>
              <circle cx="14" cy="16" r="1.2" fill="#1A1B22"/>
            </svg>
            <div class="cart-badge" id="cartBadge"></div>
          </button>
        </div>
      </header>

      <!-- ── Section Label ── -->
      <section class="section-label">
        <div class="label-title">카테고리</div>

        <div class="label-grid" id="labelGrid">
          <!-- Row 1: 항상 보임 -->
          <div class="label-row">
            <div class="label-cell selected">전체</div>
            <div class="label-cell size-14">레인보우</div>
            <div class="label-cell size-14">게이</div>
            <div class="label-cell size-13">그레이로맨틱</div>
          </div>
          <!-- Row 2: 항상 보임 -->
          <div class="label-row">
            <div class="label-cell size-13">팬섹슈얼</div>
            <div class="label-cell size-13">폴리아모리</div>
            <div class="label-cell size-14">폴리섹슈얼</div>
            <div class="label-cell size-14">BDSM</div>
          </div>
          <!-- Row 3: 접힘 -->
          <div class="label-row collapsed">
            <div class="label-cell size-13">젠더퀴어</div>
            <div class="label-cell size-14">젠더플럭스</div>
            <div class="label-cell size-14">퀘스쳐너리</div>
            <div class="label-cell size-13">트랜스젠더</div>
          </div>
          <!-- Row 4: 접힘 -->
          <div class="label-row collapsed">
            <div class="label-cell size-14">옴니섹슈얼</div>
            <div class="label-cell size-14">인터섹스</div>
            <div class="label-cell size-13">젠더리스</div>
            <div class="label-cell size-13">젠더플루이드</div>
          </div>
          <!-- Row 5: 접힘 -->
          <div class="label-row collapsed">
            <div class="label-cell size-14">에이로맨틱</div>
            <div class="label-cell size-13">에이로에이스</div>
            <div class="label-cell size-13">에이섹슈얼</div>
            <div class="label-cell size-13">에이젠더</div>
          </div>
          <!-- Row 6: 접힘 -->
          <div class="label-row collapsed">
            <div class="label-cell size-13">레즈비언</div>
            <div class="label-cell size-13">바이섹슈얼</div>
            <div class="label-cell size-13">안드로진</div>
            <div class="label-cell size-14">앨라이</div>
          </div>
          <!-- Row 7: 접힘 -->
          <div class="label-row collapsed">
            <div class="label-cell size-13">논바이너리</div>
            <div class="label-cell size-13">뉴트로이스</div>
            <div class="label-cell size-14">데미걸</div>
            <div class="label-cell size-14">데미보이</div>
          </div>
        </div>

        <!-- 더보기 버튼 -->
        <button class="label-more-btn" id="labelMoreBtn" onclick="toggleLabels()">
          <span class="label-more-text" id="labelMoreText">더보기</span>
          <span class="label-more-arrow" id="labelMoreArrow">▼</span>
        </button>
      </section>

      <!-- ── Contents ── -->
      <section class="contents" id="productGrid"></section>

      <button class="contents-more-btn" id="contentsMoreBtn" onclick="loadMore()">
        <span class="contents-more-text">더보기</span>
      </button>

    </div>
  </div>

  <script>
    let labelsExpanded = false;
    let cartCount = 0;
    let visibleCount = 10;
    let currentList = [];

    const labelKeywords = {
      '전체':       null,
      '레인보우':   ['레인보우', '무지개'],
      '게이':       ['게이'],
      '그레이로맨틱':['그레이로맨틱'],
      '팬섹슈얼':   ['팬섹슈얼', '판섹슈얼'],
      '폴리아모리': ['폴리아모리'],
      '폴리섹슈얼': ['폴리섹슈얼'],
      'BDSM':       ['BDSM'],
      '젠더퀴어':   ['젠더퀴어'],
      '젠더플럭스': ['젠더플럭스'],
      '퀘스쳐너리': ['퀘스쳐너리'],
      '트랜스젠더': ['트랜스젠더'],
      '옴니섹슈얼': ['옴니섹슈얼'],
      '인터섹스':   ['인터섹스'],
      '젠더리스':   ['젠더리스'],
      '젠더플루이드':['젠더플루이드'],
      '에이로맨틱': ['에이로맨틱'],
      '에이로에이스':['에이로에이스'],
      '에이섹슈얼': ['에이섹슈얼'],
      '에이젠더':   ['에이젠더'],
      '레즈비언':   ['레즈비언'],
      '바이섹슈얼': ['바이섹슈얼', '바이'],
      '안드로진':   ['안드로진'],
      '앨라이':     ['앨라이'],
      '논바이너리': ['논바이너리'],
      '뉴트로이스': ['뉴트로이스'],
      '데미걸':     ['데미걸'],
      '데미보이':   ['데미보이'],
    };

    function cardHtml(p) {
      const imgSrc = IMG + p.img;
      const badge = p.soldOut
        ? '<span class="card-badge sold-out">SOLD OUT</span>'
        : p.onSale ? '<span class="card-badge sale">SALE</span>' : '';
      const priceHtml = p.onSale && p.origPrice
        ? `<span class="price-sale">${p.price}</span><span class="price-orig">${p.origPrice}</span>`
        : `<span>${p.price}</span>`;
      return `
        <div class="product-card${p.soldOut ? ' is-soldout' : ''}" data-id="${p.id}">
          <div class="img-box">
            <img src="${imgSrc}" alt="${p.title}" loading="lazy">
            ${badge}
          </div>
          <div class="text-box">
            <div class="product-title">${p.title}</div>
            <div class="product-price">${priceHtml}</div>
            ${!p.soldOut ? `<button class="add-cart-btn" onclick="addToCart('${p.id}')">+ 카트에 담기</button>` : ''}
          </div>
        </div>`;
    }

    function renderProducts(list) {
      currentList = list;
      visibleCount = 10;
      const grid = document.getElementById('productGrid');
      if (!list.length) {
        grid.innerHTML = '<p style="text-align:center;padding:40px 0;color:#5F5E61;">상품이 없습니다.</p>';
        document.getElementById('contentsMoreBtn').style.display = 'none';
        return;
      }
      redraw();
    }

    function redraw() {
      const grid = document.getElementById('productGrid');
      const visible = currentList.slice(0, visibleCount);
      let html = '';
      for (let i = 0; i < visible.length; i += 2) {
        html += '<div class="product-row">';
        for (let j = i; j < i + 2 && j < visible.length; j++) {
          html += cardHtml(visible[j]);
        }
        html += '</div>';
      }
      grid.innerHTML = html;
      document.getElementById('contentsMoreBtn').style.display =
        visibleCount >= currentList.length ? 'none' : 'flex';
    }

    function loadMore() {
      visibleCount += 10;
      redraw();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderProducts(products);
      updateCartBadge();

      document.getElementById('labelGrid').addEventListener('click', (e) => {
        const cell = e.target.closest('.label-cell');
        if (!cell) return;

        document.querySelectorAll('.label-cell').forEach(el => el.classList.remove('selected'));
        cell.classList.add('selected');

        const label = cell.textContent.trim();
        const keywords = labelKeywords[label];

        if (keywords === null) {
          renderProducts(products);
        } else {
          const filtered = products.filter(p =>
            keywords.some(kw => p.title.includes(kw))
          );
          renderProducts(filtered);
        }
      });
    });

    // ── Cart ──────────────────────────────────────────────────
    function getCart() {
      try { return JSON.parse(localStorage.getItem('raon_cart') || '[]'); }
      catch { return []; }
    }
    function saveCart(cart) { localStorage.setItem('raon_cart', JSON.stringify(cart)); }

    function updateCartBadge() {
      const badge = document.getElementById('cartBadge');
      const count = getCart().length;
      if (count > 0) {
        badge.textContent = count;
        badge.classList.add('visible');
      } else {
        badge.classList.remove('visible');
      }
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      const cart = getCart();
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty = (existing.qty || 1) + 1;
      } else {
        cart.push({ ...p, cartId: id + '_' + Date.now(), qty: 1 });
      }
      saveCart(cart);
      updateCartBadge();

      // 간단한 피드백
      const btn = document.querySelector(`[data-id="${id}"] .add-cart-btn`);
      if (btn) {
        btn.textContent = '✓ 담겼어요';
        setTimeout(() => { btn.textContent = '+ 담기'; }, 1200);
      }
    }

    function toggleLabels() {
      labelsExpanded = !labelsExpanded;

      const textEl = document.getElementById('labelMoreText');
      const arrowEl = document.getElementById('labelMoreArrow');

      document.querySelectorAll('#labelGrid .label-row').forEach((row, i) => {
        if (i >= 2) {
          if (labelsExpanded) row.classList.remove('collapsed');
          else row.classList.add('collapsed');
        }
      });

      textEl.textContent = labelsExpanded ? '닫기' : '더보기';
      arrowEl.classList.toggle('up', labelsExpanded);
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
