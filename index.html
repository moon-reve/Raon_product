<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라온 (RAON)</title>

  <!-- Favicon -->
  <link rel="icon" href="/logo_square.png" type="image/png">

  <!-- OG -->
  <meta property="og:title" content="라온 (RAON)">
  <meta property="og:description" content="라온 프라이드 굿즈 스토어">
  <meta property="og:image" content="https://raon-product.vercel.app/logo_square.png">
  <meta property="og:url" content="https://raon-product.vercel.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://raon-product.vercel.app/logo_square.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#004ED4">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="라온">
  <link rel="apple-touch-icon" href="/logo_square.png">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css" rel="stylesheet" />
  <script src="products.js?v=7"></script>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div class="page">
    <div class="main">

      <!-- ── Header ── -->
      <header class="header">
        <div class="logo">RAON</div>
        <div class="header-icons">
          <!-- Cart -->
          <button class="cart-btn" aria-label="장바구니" onclick="location.href='cart.html'">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.5 3.5H4.5L6.2 12.5H15.8L17.5 6.5H5.5" stroke="#1A1B22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="8" cy="16" r="1.2" fill="#1A1B22"/>
              <circle cx="14" cy="16" r="1.2" fill="#1A1B22"/>
            </svg>
            <div class="cart-badge" id="cartBadge"></div>
          </button>
        </div>
      </header>

      <!-- ── Search Bar ── -->
      <section class="search-section">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="찾으시는 상품이 있나요?" onkeyup="if(event.key==='Enter') searchProducts()">
          <button onclick="searchProducts()" aria-label="검색">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M12.5 12.5L16 16M14 8C14 11.3137 11.3137 14 8 14C4.68629 14 2 11.3137 2 8C2 4.68629 4.68629 2 8 2C11.3137 2 14 4.68629 14 8Z" stroke="#1A1B22" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- ── Section Label ── -->
      <section class="section-label" style="gap: 32px;">

        <!-- 플래그 필터 -->
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div class="label-title">플래그 (디자인)</div>
          <div class="label-grid" id="flagGrid">
            <div class="label-row">
              <div class="label-cell size-14 selected" data-type="flag">전체</div>
              <div class="label-cell size-14" data-type="flag">레인보우</div>
              <div class="label-cell size-14" data-type="flag">게이</div>
              <div class="label-cell size-13" data-type="flag">그레이로맨틱</div>
            </div>
            <div class="label-row">
              <div class="label-cell size-13" data-type="flag">논바이너리</div>
              <div class="label-cell size-13" data-type="flag">뉴트로이스</div>
              <div class="label-cell size-14" data-type="flag">데미걸</div>
              <div class="label-cell size-14" data-type="flag">데미보이</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-13" data-type="flag">레즈비언</div>
              <div class="label-cell size-13" data-type="flag">바이섹슈얼</div>
              <div class="label-cell size-13" data-type="flag">안드로진</div>
              <div class="label-cell size-14" data-type="flag">앨라이</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-14" data-type="flag">에이로맨틱</div>
              <div class="label-cell size-13" data-type="flag">에이로에이스</div>
              <div class="label-cell size-13" data-type="flag">에이섹슈얼</div>
              <div class="label-cell size-13" data-type="flag">에이젠더</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-14" data-type="flag">옴니섹슈얼</div>
              <div class="label-cell size-14" data-type="flag">인터섹스</div>
              <div class="label-cell size-13" data-type="flag">젠더리스</div>
              <div class="label-cell size-13" data-type="flag">젠더퀴어</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-14" data-type="flag">젠더플럭스</div>
              <div class="label-cell size-13" data-type="flag">젠더플루이드</div>
              <div class="label-cell size-14" data-type="flag">퀘스쳐너리</div>
              <div class="label-cell size-13" data-type="flag">트랜스젠더</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-13" data-type="flag">팬섹슈얼</div>
              <div class="label-cell size-14" data-type="flag">폴리섹슈얼</div>
              <div class="label-cell size-13" data-type="flag">폴리아모리</div>
              <div class="label-cell size-14" data-type="flag">BDSM</div>
            </div>
          </div>
          <button class="label-more-btn" onclick="toggleLabels('flag')">
            <span class="label-more-text" id="flagMoreText">더보기</span>
            <span class="label-more-arrow" id="flagMoreArrow">▼</span>
          </button>
        </div>

        <!-- 제품 필터 -->
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div class="label-title">제품 (종류)</div>
          <div class="label-grid" id="productLabelGrid">
            <!-- 글자 짤림을 막기 위해 한 줄에 3개씩 배치 -->
            <div class="label-row">
              <div class="label-cell size-14 selected" data-type="product">전체</div>
              <div class="label-cell size-14" data-type="product">명태 키링</div>
              <div class="label-cell size-14" data-type="product">타일 자석</div>
            </div>
            <div class="label-row">
              <div class="label-cell size-14" data-type="product">스티커</div>
              <div class="label-cell size-14" data-type="product">자석 책갈피</div>
              <div class="label-cell size-14" data-type="product">아크릴 키링</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-14" data-type="product">동글 키링</div>
              <div class="label-cell size-14" data-type="product">키캡 키링</div>
              <div class="label-cell size-14" data-type="product">마우스패드</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-14" data-type="product">카라비너</div>
              <div class="label-cell size-14" data-type="product">띠깃발</div>
              <div class="label-cell size-14" data-type="product">대형 깃발</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-14" data-type="product">손깃발</div>
              <div class="label-cell size-14" data-type="product">신발끈</div>
              <div class="label-cell size-14" data-type="product">스트랩</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-14" data-type="product">귀걸이</div>
              <div class="label-cell size-14" data-type="product">뱃지</div>
              <div class="label-cell size-14" data-type="product">목걸이</div>
            </div>
            <div class="label-row collapsed">
              <div class="label-cell size-14" data-type="product">안경닦이</div>
              <div class="label-cell size-14" data-type="product">그립톡</div>
              <div class="label-cell size-14" data-type="product">손부채</div>
            </div>
          </div>
          <button class="label-more-btn" onclick="toggleLabels('product')">
            <span class="label-more-text" id="productMoreText">더보기</span>
            <span class="label-more-arrow" id="productMoreArrow">▼</span>
          </button>
        </div>

      </section>

      <!-- ── Contents ── -->
      <section class="contents" id="productGrid"></section>

      <!-- 무한 스크롤 감지용 센티널 (보이지 않음) -->
      <div id="scrollSentinel" style="height: 1px;"></div>

    </div>
  </div>

  <script>
    let flagExpanded = false;
    let productExpanded = false;
    let selectedFlag = '전체';
    let selectedProduct = '전체';
    let cartCount = 0;
    let visibleCount = 10;
    let currentList = [];

    const flagKeywords = {
      '전체':       null,
      '레인보우':   { 
        inc: ['레인보우', '무지개'], 
        exc: ['트랜스젠더', '팬섹슈얼', '판섹슈얼', '바이섹슈얼', '바이', '논바이너리', '에이섹슈얼', '에이로맨틱', '에이로에이스', '에이젠더', '젠더플루이드', '젠더퀴어', '젠더플럭스', '젠더리스', '옴니섹슈얼', '폴리섹슈얼', '폴리아모리', '안드로진', '인터섹스', '데미걸', '데미보이', '데미섹슈얼', '데미로맨틱', '퀘스쳐너리', '앨라이', 'BDSM', '인클루시브', '부치', '게이']
      },
      '게이':       ['게이'],
      '그레이로맨틱':['그레이로맨틱'],
      '팬섹슈얼':   ['팬섹슈얼', '판섹슈얼'],
      '폴리아모리': ['폴리아모리'],
      '폴리섹슈얼': ['폴리섹슈얼'],
      'BDSM':       ['BDSM'],
      '젠더퀴어':   ['젠더퀴어'],
      '젠더플럭스': ['젠더플럭스'],
      '퀘스쳐너리': ['퀘스쳐너리'],
      '트랜스젠더': ['트랜스젠더'],
      '옴니섹슈얼': ['옴니섹슈얼'],
      '인터섹스':   ['인터섹스'],
      '젠더리스':   ['젠더리스'],
      '젠더플루이드':['젠더플루이드'],
      '에이로맨틱': ['에이로맨틱'],
      '에이로에이스':['에이로에이스'],
      '에이섹슈얼': ['에이섹슈얼'],
      '에이젠더':   ['에이젠더'],
      '레즈비언':   ['레즈비언', '부치'],
      '바이섹슈얼': ['바이섹슈얼', '바이'],
      '안드로진':   ['안드로진'],
      '앨라이':     ['앨라이'],
      '논바이너리': ['논바이너리'],
      '뉴트로이스': ['뉴트로이스'],
      '데미걸':     ['데미걸'],
      '데미보이':   ['데미보이'],
    };

    const productKeywords = {
      '전체': null,
      '명태 키링': ['명태 키링'],
      '타일 자석': ['타일 자석', '호작도'],
      '스티커': ['스티커'],
      '자석 책갈피': ['자석책갈피', '자석 책갈피'],
      '아크릴 키링': ['아크릴 키링'],
      '동글 키링': ['동글 키링'],
      '키캡 키링': ['키캡 키링'],
      '마우스패드': ['마우스패드'],
      '카라비너': ['카라비너'],
      '띠깃발': ['띠깃발'],
      '대형 깃발': ['대형 프라이드 깃발', '투쟁 깃발'],
      '손깃발': ['손깃발'],
      '신발끈': ['신발끈'],
      '스트랩': ['스트랩'],
      '귀걸이': ['귀걸이', '귀찌'],
      '뱃지': ['뱃지', '브로치', '핀'],
      '목걸이': ['목걸이'],
      '안경닦이': ['안경 클리너', '안경닦이'],
      '그립톡': ['그립톡'],
      '손부채': ['손부채', '부채']
    };

    function cardHtml(p) {
      const imgSrc = IMG + p.img;
      const badge = p.soldOut
        ? '<span class="card-badge sold-out">SOLD OUT</span>'
        : p.onSale ? '<span class="card-badge sale">SALE</span>' : '';
      const priceHtml = p.onSale && p.origPrice
        ? `<span class="price-sale">${p.price}</span><span class="price-orig">${p.origPrice}</span>`
        : `<span>${p.price}</span>`;
      return `
        <div class="product-card${p.soldOut ? ' is-soldout' : ''}" data-id="${p.id}">
          <div class="img-box">
            <img src="${imgSrc}" alt="${p.title}" loading="lazy">
            ${badge}
          </div>
          <div class="text-box">
            <div class="product-title">${p.title}</div>
            <div class="product-price">${priceHtml}</div>
            ${!p.soldOut ? `<button class="add-cart-btn" onclick="addToCart('${p.id}')">+ 카트에 담기</button>` : ''}
          </div>
        </div>`;
    }

    function renderProducts(list) {
      currentList = list;
      visibleCount = 10;
      const grid = document.getElementById('productGrid');
      if (!list.length) {
        grid.innerHTML = '<p style="text-align:center;padding:40px 0;color:#5F5E61;">상품이 없습니다.</p>';
        document.getElementById('scrollSentinel').style.display = 'none';
        return;
      }
      redraw();
    }

    function redraw() {
      const grid = document.getElementById('productGrid');
      const visible = currentList.slice(0, visibleCount);
      let html = '';
      for (let i = 0; i < visible.length; i += 2) {
        html += '<div class="product-row">';
        for (let j = i; j < i + 2 && j < visible.length; j++) {
          html += cardHtml(visible[j]);
        }
        html += '</div>';
      }
      grid.innerHTML = html;
      document.getElementById('scrollSentinel').style.display =
        visibleCount >= currentList.length ? 'none' : 'block';
    }

    function loadMore() {
      visibleCount += 10;
      redraw();
    }

    // 홈으로 돌아올 때마다 뱃지 업데이트 (장바구니에서 삭제 후 반영)
    window.addEventListener('pageshow', () => updateCartBadge());
    window.addEventListener('focus', () => updateCartBadge());

    document.addEventListener('DOMContentLoaded', () => {
      renderProducts(products);
      updateCartBadge();

      // 무한 스크롤 (Intersection Observer) 설정
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && visibleCount < currentList.length) {
          loadMore();
        }
    }, { rootMargin: '0px' }); // 바닥에 완전히 닿았을 때 로드
      observer.observe(document.getElementById('scrollSentinel'));

      document.querySelectorAll('.label-grid').forEach(grid => {
        grid.addEventListener('click', (e) => {
          const cell = e.target.closest('.label-cell');
          if (!cell) return;

          // 클릭한 영역(그리드) 내에서만 선택 상태 변경
          grid.querySelectorAll('.label-cell').forEach(el => el.classList.remove('selected'));
          cell.classList.add('selected');

          document.getElementById('searchInput').value = ''; // 필터 클릭 시 검색창 초기화

          if (cell.dataset.type === 'flag') {
            selectedFlag = cell.textContent.trim();
          } else if (cell.dataset.type === 'product') {
            selectedProduct = cell.textContent.trim();
          }

          filterProducts();
        });
      });
    });

    function filterProducts() {
      let result = products;

      // 1. 플래그(디자인) 교집합 필터
      if (selectedFlag !== '전체') {
        const fKw = flagKeywords[selectedFlag];
        result = result.filter(p => {
          if (Array.isArray(fKw)) {
            return fKw.some(kw => p.title.includes(kw));
          } else {
            const hasInc = fKw.inc.some(kw => p.title.includes(kw));
            const hasExc = fKw.exc.some(kw => p.title.includes(kw));
            return hasInc && !hasExc;
          }
        });
      }

      // 2. 제품(종류) 교집합 필터
      if (selectedProduct !== '전체') {
        const pKw = productKeywords[selectedProduct];
        result = result.filter(p => pKw.some(kw => p.title.includes(kw)));
      }

      renderProducts(result);
    }

    // ── Search ────────────────────────────────────────────────
    function searchProducts() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      
      // 검색 시 모든 카테고리 '전체'로 초기화
      document.querySelectorAll('.label-cell').forEach(el => el.classList.remove('selected'));
      document.querySelectorAll('.label-grid').forEach(grid => {
         grid.querySelector('.label-cell').classList.add('selected');
      });
      selectedFlag = '전체';
      selectedProduct = '전체';

      if (!query) {
        renderProducts(products);
        return;
      }

      const filtered = products.filter(p => p.title.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    // ── Cart ──────────────────────────────────────────────────
    function getCart() {
      try { return JSON.parse(localStorage.getItem('raon_cart') || '[]'); }
      catch { return []; }
    }
    function saveCart(cart) { localStorage.setItem('raon_cart', JSON.stringify(cart)); }

    function updateCartBadge() {
      const badge = document.getElementById('cartBadge');
      const count = getCart().length;
      if (count > 0) {
        badge.textContent = count;
        badge.classList.add('visible');
      } else {
        badge.classList.remove('visible');
      }
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      const cart = getCart();
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty = (existing.qty || 1) + 1;
      } else {
        cart.push({ ...p, cartId: id + '_' + Date.now(), qty: 1 });
      }
      saveCart(cart);
      updateCartBadge();

      // 간단한 피드백
      const btn = document.querySelector(`[data-id="${id}"] .add-cart-btn`);
      if (btn) {
        btn.textContent = '✓ 담겼어요';
        setTimeout(() => { btn.textContent = '+ 담기'; }, 1200);
      }
    }

    function toggleLabels(type) {
      if (type === 'flag') {
        flagExpanded = !flagExpanded;
        updateToggleUI('flagGrid', 'flagMoreText', 'flagMoreArrow', flagExpanded);
      } else {
        productExpanded = !productExpanded;
        updateToggleUI('productLabelGrid', 'productMoreText', 'productMoreArrow', productExpanded);
      }
    }

    function updateToggleUI(gridId, textId, arrowId, isExpanded) {
      const textEl = document.getElementById(textId);
      const arrowEl = document.getElementById(arrowId);

      document.querySelectorAll(`#${gridId} .label-row`).forEach((row, i) => {
        if (i >= 2) {
          if (isExpanded) row.classList.remove('collapsed');
          else row.classList.add('collapsed');
        }
      });

      textEl.textContent = isExpanded ? '닫기' : '더보기';
      arrowEl.classList.toggle('up', isExpanded);
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
